name: Checks
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm -C frontend install --frozen-lockfile
      - run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
      - run: make -C backend generate
      - run: make -C frontend generate
      - run: git diff --exit-code -- backend/openapi.json backend/internal/store frontend/src/native/generated.ts
      - run: make -C backend lint build
      - run: make -C frontend lint build
