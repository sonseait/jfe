version: "2"
sql:
  - engine: postgresql
    queries: db/queries
    schema: db/migrations
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_empty_slices: true
        overrides:
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
